
# ─────────────────────────────────────────────
#  LectureNotes AI — central configuration
# ─────────────────────────────────────────────

embedding:
  model: all-MiniLM-L6-v2          # switch to all-mpnet-base-v2 for higher quality

segmentation:
  window_size: 3                   # sentences per window for cosine comparison
  step: 1                          # window slide step
  threshold: 0.25                  # cosine-similarity drop triggers a boundary

keybert:
  top_n: 8
  diversity: 0.5                   # MMR diversity 0–1

spacy:
  model: en_core_web_sm

nli:
  model: cross-encoder/nli-deberta-v3-base
  entailment_threshold: 0.70       # items below this are flagged

llm:
  provider: gemini                  # gemini | azure | claude | ollama | mock
  gemini_model: gemini-2.5-flash
  ollama_base_url: http://localhost:11434
  ollama_model: llama3.1:8b
  azure_deployment: gpt-4o
  azure_api_version: "2024-02-01"
  claude_model: claude-3-5-sonnet-20241022
  max_tokens: 2048
  temperature: 0.2

generation:
  flashcard_count: 15
  mcq_count: 5

ingest:
  pdf_min_chars_per_page: 10       # pages with fewer chars are skipped (images)

cache:
  directory: .cache/diskcache
  size_limit_gb: 2
